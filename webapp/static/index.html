<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multilingual OCR Demo</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --border: #2a2e3a;
    --text: #e6e8ee;
    --muted: #9aa0ad;
    --accent: #5b8cff;
    --accent-dim: #3a5bb8;
    --ok: #4caf7d;
    --warn: #e0a640;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 24px 32px 8px;
  }
  header h1 { margin: 0 0 4px; font-size: 22px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 32px 64px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  select, input[type=file] {
    background: #0c0e13;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 14px;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { background: var(--accent-dim); cursor: not-allowed; }
  .script-note {
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
    line-height: 1.5;
  }
  #preview {
    max-width: 100%;
    max-height: 260px;
    border-radius: 6px;
    border: 1px solid var(--border);
    margin-top: 12px;
    display: none;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  .crop-thumb { width: 90px; max-height: 40px; object-fit: contain; border: 1px solid var(--border); border-radius: 4px; background: white; }
  .route { color: var(--muted); font-size: 11px; }
  .status { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .status.error { color: #e05c5c; }
  .status.ok { color: var(--ok); }
  .empty { color: var(--muted); font-style: italic; padding: 16px; text-align: center; }
  code { background: #0c0e13; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>Multilingual OCR — Demo</h1>
  <p>English / Tamil / Hindi. A pilot-scale research demo, not a production accuracy claim — see <code>docs/limitations.md</code> in the repo.</p>
</header>
<main>
  <div class="panel">
    <div class="row">
      <select id="script">
        <option value="english">English (EAST + TrOCR)</option>
        <option value="tamil">Tamil (EAST + ocr_tamil)</option>
        <option value="hindi">Hindi (EasyOCR, self-detecting)</option>
      </select>
      <input type="file" id="file" accept="image/*">
      <button id="run" disabled>Run OCR</button>
    </div>
    <div class="script-note" id="script-note"></div>
    <img id="preview">
    <div class="status" id="status"></div>
  </div>

  <div class="panel">
    <table id="results-table" style="display:none">
      <thead>
        <tr><th>#</th><th>Crop</th><th>Label</th><th>Recognized text</th></tr>
      </thead>
      <tbody id="results-body"></tbody>
    </table>
    <div class="empty" id="empty-state">Upload an image and run OCR to see results here.</div>
  </div>
</main>

<script>
const API = "/api/ocr";

const notes = {
  english: "EAST detection + grouping + printed/handwritten classifier + TrOCR.",
  tamil: "EAST detection + grouping, then ocr_tamil (CRAFT+PARSEQ) recognition. Pilot CER on a small synthetic set: 46.3% — EAST systematically under-sizes boxes for Tamil glyphs.",
  hindi: "EasyOCR's own detector (EAST produces zero detections for Devanagari). Pilot CER: 7.1%.",
};

const scriptSel = document.getElementById("script");
const fileInput = document.getElementById("file");
const runBtn = document.getElementById("run");
const preview = document.getElementById("preview");
const statusEl = document.getElementById("status");
const table = document.getElementById("results-table");
const body = document.getElementById("results-body");
const emptyState = document.getElementById("empty-state");
const scriptNote = document.getElementById("script-note");

function updateNote() {
  scriptNote.textContent = notes[scriptSel.value] || "";
}
scriptSel.addEventListener("change", updateNote);
updateNote();

fileInput.addEventListener("change", () => {
  const f = fileInput.files[0];
  runBtn.disabled = !f;
  if (f) {
    preview.src = URL.createObjectURL(f);
    preview.style.display = "block";
  } else {
    preview.style.display = "none";
  }
});

runBtn.addEventListener("click", async () => {
  const f = fileInput.files[0];
  if (!f) return;

  runBtn.disabled = true;
  statusEl.className = "status";
  statusEl.textContent = "Running pipeline… (first run per language loads models, can take a while)";

  const form = new FormData();
  form.append("file", f);
  form.append("script", scriptSel.value);

  try {
    const res = await fetch(API, { method: "POST", body: form });
    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.detail || "Request failed");
    }

    renderResults(data.results);
    statusEl.className = "status ok";
    statusEl.textContent = `Done — ${data.results.length} region(s) detected (script: ${data.script}).`;
  } catch (err) {
    statusEl.className = "status error";
    statusEl.textContent = "Error: " + err.message;
  } finally {
    runBtn.disabled = false;
  }
});

function renderResults(results) {
  body.innerHTML = "";
  if (!results.length) {
    table.style.display = "none";
    emptyState.style.display = "block";
    emptyState.textContent = "No text regions detected.";
    return;
  }

  table.style.display = "table";
  emptyState.style.display = "none";

  for (const r of results) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.index}</td>
      <td><img class="crop-thumb" src="${r.crop_url}" loading="lazy"></td>
      <td>${r.label}<div class="route">${r.route}</div></td>
      <td>${escapeHtml(r.text)}</td>
    `;
    body.appendChild(tr);
  }
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}
</script>
</body>
</html>
